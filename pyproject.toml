[project]
name = "mcp-codemagic"
version = "0.1.0"
description = "MCP server for Codemagic CI/CD — trigger and inspect builds from Claude Code"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "MusicTech Lab", email = "opensource@musictechlab.io" },
]
keywords = ["mcp", "codemagic", "claude-code", "ci-cd", "ci", "builds", "flutter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/musictechlab/mcp-codemagic"
Repository = "https://github.com/musictechlab/mcp-codemagic"
Issues = "https://github.com/musictechlab/mcp-codemagic/issues"

[project.scripts]
mcp-codemagic = "mcp_codemagic.__main__:main"

[tool.poetry]
packages = [{ include = "mcp_codemagic", from = "src" }]

[tool.poetry.group.dev.dependencies]
ruff = "^0.6.0"
pytest = "^8.0.0"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
